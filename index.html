<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Vector Favicon & PWA App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#03050c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura3D" />
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Aura3D — Estación de audio espacial con visualizadores 3D y cámara musical interactiva" />
    <title>Aura3D Studio</title>
    
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Geist:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <!-- Base Anti-FOUC & Splash Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #03050c;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        -webkit-user-select: none;
      }
      
      #root {
        width: 100%;
        min-height: 100dvh;
      }
      
      /* Initial entrance splash screen — fades out smoothly when React mounts */
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #03050c;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 400ms cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
      }
      
      #initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      #initial-splash .spinner {
        width: 34px;
        height: 34px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00e5ff;
        border-radius: 9999px;
        animation: aura-spin 800ms linear infinite;
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
      }
      
      @keyframes aura-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Initial Splash Screen: Removed dynamically by main.tsx -->
    <div id="initial-splash" aria-hidden="true">
      <div class="spinner"></div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
